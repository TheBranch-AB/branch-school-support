<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facilities Reports | The Branch School</title><style>body{font:16px system-ui;background:#0b111b;color:#eaf1fa;margin:0;padding:24px}.app{max-width:780px;margin:auto}h1{margin-bottom:5px}p{color:#a7b7c9}.card{background:#14202d;border:1px solid #324254;border-radius:12px;padding:14px;margin:10px 0}a{color:#9dd3ff}button{padding:10px;border-radius:8px;background:#c6e6ff;border:0;cursor:pointer}.muted{color:#9eafc4}</style></head><body><main class="app"><p>THE BRANCH SCHOOL · FACILITIES</p><h1>Scott's Daily Reports</h1><p>Reports are saved as JSON in GitHub. This page and the reports are publicly readable.</p><button onclick="load()">Refresh reports</button><div id="results" role="status">Loading…</div></main><script>
const base='https://api.github.com/repos/TheBranch-AB/branch-school-support/contents/reports';
const box=document.getElementById('results');
async function get(path){const r=await fetch(base+path,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub HTTP '+r.status);return r.json()}
async function load(){box.textContent='Loading…';try{const days=(await get('')).filter(x=>x.type==='dir').sort((a,b)=>b.name.localeCompare(a.name)).slice(0,31);if(!days.length){box.textContent='No reports yet.';return}box.replaceChildren();for(const day of days){const heading=document.createElement('h2');heading.textContent=day.name;box.append(heading);const files=await get('/'+encodeURIComponent(day.name));for(const f of files.filter(x=>x.name.endsWith('.json'))){const report=await (await fetch('https://raw.githubusercontent.com/TheBranch-AB/branch-school-support/main/'+f.path)).json();const all=report.sections.flatMap(s=>s.tasks),done=all.filter(t=>t.complete).length,card=document.createElement('div');card.className='card';const title=document.createElement('strong');title.textContent=(report.initials||'Staff')+' — '+done+'/'+all.length+' tasks completed';const when=document.createElement('p');when.textContent='Submitted '+(report.submittedAt||'unknown');const notes=document.createElement('p');notes.textContent='Notes: '+(report.notes||'None');const link=document.createElement('a');link.href='https://github.com/TheBranch-AB/branch-school-support/blob/main/'+f.path;link.target='_blank';link.rel='noopener';link.textContent='View full report';card.append(title,when,notes,link);box.append(card)}}}catch(e){box.textContent='Unable to load reports: '+e.message+'. If this is the first submission, the reports folder may not exist yet.'}}
load();</script></body></html>
